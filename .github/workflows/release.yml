name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (workflow_dispatch builds artifacts only unless a tag is pushed)"
        required: false

permissions:
  contents: write

env:
  PLUGIN_ID: live-routes

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14, ext: dylib }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel, ext: dylib }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, ext: so }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, ext: so }
          - { goos: windows, goarch: amd64, runner: windows-latest, ext: dll }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build plugin library
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goos == 'windows' && 'gcc' || '' }}
        run: |
          mkdir -p out
          go build -trimpath -ldflags "-s -w" -buildmode=c-shared -o "out/${PLUGIN_ID}.${{ matrix.ext }}" .
          rm -f out/*.h
          ls -l out

      - name: Package
        run: |
          zipname="${PLUGIN_ID}_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'out/${PLUGIN_ID}.${{ matrix.ext }}' -DestinationPath 'dist/${zipname}'"
          else
            (cd out && zip -q "../dist/${zipname}" "${PLUGIN_ID}.${{ matrix.ext }}")
          fi
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
