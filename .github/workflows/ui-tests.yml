name: UI tests
on:
  pull_request:
    paths: ['web/**', 'package*.json', '.github/workflows/ui-tests.yml']
  push:
    branches: [main]
    paths: ['web/**', 'package*.json', '.github/workflows/ui-tests.yml']
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - run: npm run test:browser
      - run: npm run test:i18n
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screenshots
          path: web/test/out/
