name: UI tests
on:
  pull_request:
    paths: ['web/**', 'package*.json', '.github/workflows/ui-tests.yml']
  push:
    branches: [main]
    paths: ['web/**', 'package*.json', '.github/workflows/ui-tests.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screenshots
          path: web/test/out/
